name: Validate and deploy NOEMA ATLAS to GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/phase-2a-structured-content]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install validation and browser-test dependencies
        run: npm install --no-save --no-package-lock ajv@8.17.1 ajv-formats@3.0.1 playwright@1.56.1
      - name: Validate static application and structured content
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          node --check app.js
          node scripts/validate-content.mjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: node tests/browser-smoke.mjs
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
